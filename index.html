<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stack o' Money</title>
<style>
  :root { --bg:#ebe7df; --panel:rgba(255,255,255,.92); --ink:#1f2328; --muted:#646b73; --accent:#c9782e; --err:#b42318; --line:#d9d4ca; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  #scene { position:fixed; inset:0; display:block; }
  .panel { position:fixed; top:16px; left:16px; width:min(340px, calc(100vw - 32px)); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; box-shadow:0 6px 24px rgba(0,0,0,.08); backdrop-filter:blur(6px); max-height:calc(100vh - 32px); overflow:auto; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 12px; }
  form { display:flex; gap:8px; }
  .field { flex:1; position:relative; }
  input { width:100%; font:inherit; font-size:18px; padding:9px 30px 9px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  .field span { position:absolute; right:11px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:18px; pointer-events:none; }
  button { font:inherit; font-weight:600; padding:9px 14px; border:0; border-radius:8px; background:var(--ink); color:#fff; cursor:pointer; }
  button:hover { background:#3a4048; }
  .row { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:13px; color:var(--muted); }
  select { font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); }
  .error { color:var(--err); font-size:13px; margin-top:8px; min-height:0; }
  .error:empty, ul:empty, .stats:empty { display:none; }
  ul { list-style:none; margin:12px 0 0; padding:12px 0 0; border-top:1px solid var(--line); font-size:14px; }
  li { display:flex; justify-content:space-between; gap:12px; padding:3px 0; }
  li b { font-variant-numeric:tabular-nums; }
  .stats { margin-top:10px; padding-top:10px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); }
  .hint { position:fixed; right:16px; bottom:12px; font-size:12px; color:var(--muted); }
  @media (max-width:600px) { .hint { display:none; } }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="panel">
  <h1>Stack o' Money</h1>
  <p class="sub">Your amount as real-size strapped wads of euro banknotes.</p>
  <form id="form" autocomplete="off">
    <div class="field">
      <input id="amount" inputmode="numeric" value="13.000" aria-label="Amount in euro">
      <span>€</span>
    </div>
    <button type="submit">Stack it</button>
  </form>
  <div class="row">
    <label for="denom">Notes per wad</label>
    <select id="denom">
      <option value="50" selected>50 € (standard)</option>
      <option value="100">100 €</option>
      <option value="20">20 €</option>
      <option value="10">10 €</option>
      <option value="5">5 €</option>
    </select>
    <span>×100</span>
  </div>
  <div class="row">
    <label for="ref">For scale</label>
    <select id="ref">
      <option value="auto" selected>Auto</option>
      <option value="card">Credit card</option>
      <option value="can">Soda can</option>
      <option value="ball">Basketball</option>
      <option value="chair">Chair</option>
      <option value="person">Person</option>
      <option value="car">Car</option>
      <option value="none">None</option>
    </select>
  </div>
  <div class="error" id="error"></div>
  <ul id="breakdown"></ul>
  <div class="stats" id="stats"></div>
</div>
<div class="hint">Drag to orbit · scroll to zoom · right-drag to pan</div>

<script src="textures.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Physical constants (1 scene unit = 1 cm) ----------
const NOTE = {            // Europa series, width x height in cm
  5:   { w: 12.0, d: 6.2, edge: '#b9bdb0' },
  10:  { w: 12.7, d: 6.7, edge: '#d9a6a0' },
  20:  { w: 13.3, d: 7.2, edge: '#a9b9d8' },
  50:  { w: 14.0, d: 7.7, edge: '#e7bb8c' },
  100: { w: 14.7, d: 7.7, edge: '#b9d6a2' },
};
const T = 0.011;              // thickness of one note (~0.11 mm)
const PER_STRAP = 100;        // notes per wad
const STRAP_W = 2.6;          // strap band width
const STRAP_T = 0.02;         // strap paper thickness
const MAX_AMOUNT = 1_000_000_000;   // performance guard only: 200.000 instanced wads of 50€
const fmt = n => n.toLocaleString('de-DE');
const VIEW_DIR = new THREE.Vector3(0.55, 0.72, 1).normalize();   // initial camera direction (from front-right, above)

// ---------- Renderer / scene ----------
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color('#ebe7df');
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 5000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 - 0.03;

scene.add(new THREE.HemisphereLight('#ffffff', '#b8ad9c', 1.6));
const sun = new THREE.DirectionalLight('#fff6ea', 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1),
  new THREE.MeshStandardMaterial({ color: '#e2ddd3', roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- Materials ----------
const loader = new THREE.TextureLoader();
const faceMats = {};   // per denomination: { top, edge }
function noteMaterials(den) {
  if (faceMats[den]) return faceMats[den];
  const tex = loader.load(window.BANKNOTE_TEXTURES[den]);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = maxAniso;
  const top = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85 });
  const edge = new THREE.MeshStandardMaterial({ map: edgeTexture(NOTE[den].edge), roughness: 0.95 });
  return (faceMats[den] = { top, edge });
}

// Paper-edge texture: EDGE_NOTES thin layers, each a slightly different shade with a dark seam.
const EDGE_NOTES = 64;
function edgeTexture(hex) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = EDGE_NOTES * 4;
  const g = c.getContext('2d');
  const base = new THREE.Color(hex);
  for (let i = 0; i < EDGE_NOTES; i++) {
    const k = 0.86 + Math.random() * 0.2;
    const col = base.clone().multiplyScalar(k);
    g.fillStyle = `#${col.getHexString()}`;
    g.fillRect(0, i * 4, c.width, 3);
    g.fillStyle = `#${base.clone().multiplyScalar(0.6).getHexString()}`;
    g.fillRect(0, i * 4 + 3, c.width, 1);
    // a little paper fibre noise
    for (let j = 0; j < 6; j++) {
      g.fillStyle = `rgba(255,255,255,${Math.random() * 0.25})`;
      g.fillRect(Math.random() * c.width, i * 4 + Math.random() * 3, 4 + Math.random() * 20, 1);
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = maxAniso;
  return t;
}

const strapPlain = new THREE.MeshStandardMaterial({ color: '#fbfaf6', roughness: 0.9 });
const strapTextCache = {};
function strapTopMaterial(amount, count, den) {
  const key = `${amount}|${count}|${den}`;
  if (strapTextCache[key]) return strapTextCache[key];
  const c = document.createElement('canvas');
  c.width = 1024; c.height = Math.round(1024 * STRAP_W / NOTE[den].d);
  const g = c.getContext('2d');
  g.fillStyle = '#fbfaf6'; g.fillRect(0, 0, c.width, c.height);
  g.strokeStyle = '#d8d3c8'; g.lineWidth = 6;
  g.strokeRect(10, 10, c.width - 20, c.height - 20);
  g.fillStyle = '#1f2328'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = `700 ${Math.round(c.height * 0.46)}px system-ui, "Segoe UI", sans-serif`;
  g.fillText(`${fmt(amount)}€`, c.width / 2, c.height * 0.43);
  g.fillStyle = '#646b73';
  g.font = `500 ${Math.round(c.height * 0.17)}px system-ui, "Segoe UI", sans-serif`;
  g.fillText(`${count} × ${den}€`, c.width / 2, c.height * 0.8);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  t.center.set(0.5, 0.5);
  t.rotation = Math.PI / 2;     // text runs along the strap, across the short side of the note
  const m = new THREE.MeshStandardMaterial({ map: t, roughness: 0.9 });
  return (strapTextCache[key] = m);
}

// ---------- Geometry ----------
// Box of `count` notes. Edge UVs are scaled so each note gets one layer of the edge texture.
function stackGeometry(den, count) {
  const { w, d } = NOTE[den];
  const g = new THREE.BoxGeometry(w, count * T, d);
  const uv = g.attributes.uv;
  const rep = count / EDGE_NOTES;
  for (const face of [0, 1, 4, 5]) {           // +x, -x, +z, -z sides
    for (let v = face * 4; v < face * 4 + 4; v++) uv.setY(v, uv.getY(v) * rep);
  }
  g.translate(0, count * T / 2, 0);            // origin at the bottom
  return g;
}
const stackMats = m => [m.edge, m.edge, m.top, m.top, m.edge, m.edge];

function strapGeometry(den, count) {
  const g = new THREE.BoxGeometry(STRAP_W, count * T + 2 * STRAP_T, NOTE[den].d + 2 * STRAP_T);
  g.translate(0, count * T / 2, 0);
  return g;
}
const strapMats = top => [strapPlain, strapPlain, top, strapPlain, strapPlain, strapPlain];

// ---------- Money logic ----------
function parseAmount(raw) {
  let s = raw.replace(/[€\s]/g, '').replace(/eur$/i, '');
  if (!s) return { error: 'Enter an amount in euro.' };
  let n;
  if (/^\d{1,3}([.,]\d{3})+$/.test(s)) n = Number(s.replace(/[.,]/g, ''));      // 13.000 / 13,000
  else if (/^\d+([.,]\d{1,2})?$/.test(s)) n = Number(s.replace(',', '.'));     // 13000 / 13000,00
  else return { error: 'That doesn\'t look like a number.' };
  if (!Number.isInteger(n)) return { error: 'Cents need coins: enter a whole multiple of 5 €.' };
  if (n <= 0) return { error: 'Enter an amount above 0 €.' };
  if (n % 5 !== 0) return { error: `${fmt(n)} € isn't a multiple of 5 € — the smallest banknote is 5 €, no coins here.` };
  if (n > MAX_AMOUNT) return { error: `Let's keep it under ${fmt(MAX_AMOUNT)} € (beyond that the browser struggles to draw every wad).` };
  return { value: n };
}

function breakdown(amount, den) {
  const wad = den * PER_STRAP;
  const full = Math.floor(amount / wad);
  let rest = amount - full * wad;
  const partial = Math.floor(rest / den);
  rest -= partial * den;
  const loose = [];
  for (const d of [100, 50, 20, 10, 5]) {
    if (d >= den) continue;
    while (rest >= d) { loose.push(d); rest -= d; }
  }
  return { full, partial, loose };
}

// ---------- Build scene ----------
let group = null;
function disposeGroup() {
  if (!group) return;
  group.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  scene.remove(group);
  group = null;
}

function build(amount, den) {
  disposeGroup();
  group = new THREE.Group();
  scene.add(group);
  const { w, d } = NOTE[den];
  const { full, partial, loose } = breakdown(amount, den);
  const mats = noteMaterials(den);
  const gap = 1.2;
  const layerH = PER_STRAP * T + 2 * STRAP_T + 0.01;
  const box = new THREE.Box3();

  // Full wads: arranged in piles on a roughly square footprint
  let frontZ = 0, gridW = 0;
  if (full > 0) {
    // Small amounts spread out flat; larger ones grow towards a cube (equal width, depth and height).
    // cubeLayers: layers needed for a cube of the same volume; full^0.6 keeps small piles from becoming lone towers.
    const cubeSide = Math.cbrt(full * (w + gap) * (d + gap) * layerH);
    const cubeLayers = Math.round(cubeSide / layerH);
    const layers = full <= 6 ? 1 : Math.max(1, Math.min(cubeLayers, Math.ceil(full ** 0.6)));
    const piles = Math.ceil(full / layers);
    const cols = Math.max(1, Math.round(Math.sqrt(piles * d / w)));
    const rows = Math.ceil(piles / cols);
    const pitchX = w + gap, pitchZ = d + gap;
    gridW = cols * pitchX - gap;
    const x0 = -gridW / 2 + w / 2, z0 = -(rows * pitchZ - gap) / 2 + d / 2;

    const stackMesh = new THREE.InstancedMesh(stackGeometry(den, PER_STRAP), stackMats(mats), full);
    const strapMesh = new THREE.InstancedMesh(strapGeometry(den, PER_STRAP), strapMats(strapTopMaterial(den * PER_STRAP, PER_STRAP, den)), full);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), one = new THREE.Vector3(1, 1, 1);
    for (let i = 0; i < full; i++) {
      const pile = Math.floor(i / layers), layer = i % layers;
      // fill front-to-back so the shorter, unfinished pile ends up in the back corner
      const col = pile % cols, row = rows - 1 - Math.floor(pile / cols);
      // tiny jitter so piles look hand-stacked
      q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), (Math.random() - 0.5) * 0.03);
      p.set(x0 + col * pitchX + (Math.random() - 0.5) * 0.15, STRAP_T + layer * layerH, z0 + row * pitchZ + (Math.random() - 0.5) * 0.15);
      m.compose(p, q, one);
      stackMesh.setMatrixAt(i, m);
      strapMesh.setMatrixAt(i, m);
    }
    for (const mesh of [stackMesh, strapMesh]) { mesh.castShadow = mesh.receiveShadow = true; group.add(mesh); }
    stackMesh.computeBoundingBox(); box.union(stackMesh.boundingBox);
    frontZ = z0 + (rows - 1) * pitchZ + d / 2 + gap * 2.5;
  }

  // Front row: partial wad + loose notes
  const frontItems = [];
  if (partial > 0) frontItems.push({ kind: 'partial', width: w });
  if (loose.length) frontItems.push({ kind: 'loose', width: NOTE[loose[0]].w + 3 * (loose.length - 1) });
  const frontW = frontItems.reduce((s, it) => s + it.width, 0) + gap * 2 * Math.max(0, frontItems.length - 1);
  let x = -frontW / 2;
  const fz = full > 0 ? frontZ + d / 2 : 0;

  for (const it of frontItems) {
    if (it.kind === 'partial') {
      const s = new THREE.Mesh(stackGeometry(den, partial), stackMats(mats));
      const st = new THREE.Mesh(strapGeometry(den, partial), strapMats(strapTopMaterial(partial * den, partial, den)));
      for (const o of [s, st]) { o.position.set(x + w / 2, STRAP_T, fz); o.castShadow = o.receiveShadow = true; group.add(o); }
      box.expandByObject(s);
    } else {
      let y = 0.003;
      loose.forEach((ld, i) => {
        const n = NOTE[ld];
        const o = new THREE.Mesh(stackGeometry(ld, 1), stackMats(noteMaterials(ld)));
        o.position.set(x + n.w / 2 + i * 3, y, fz + i * 0.9 - (loose.length - 1) * 0.45);
        o.rotation.y = 0.12 - i * 0.12;
        o.castShadow = o.receiveShadow = true;
        group.add(o);
        box.expandByObject(o);
        y += T * 1.6;
      });
    }
    x += it.width + gap * 2;
  }

  const refs = placeReferences(box, refSel.value);
  frame(box);
  return { full, partial, loose, refs };
}

// ---------- Reference objects (real size, built from primitives, origin at floor centre) ----------
const refCache = {};
const refGroup = new THREE.Group();
scene.add(refGroup);

function std(color, extra = {}) { return new THREE.MeshStandardMaterial({ color, roughness: 0.6, ...extra }); }
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso;
  return t;
}
function part(geo, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); return m;
}

function makeCard() {           // ISO/IEC 7810 ID-1: 85.60 × 53.98 × 0.76 mm
  const top = canvasTex(856, 540, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, w, h);
    gr.addColorStop(0, '#1d2b53'); gr.addColorStop(1, '#4b2a6b');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.fillStyle = '#d4b260'; g.beginPath(); g.roundRect(80, 190, 120, 92, 14); g.fill();
    g.strokeStyle = '#a88a3e'; g.lineWidth = 3; g.strokeRect(100, 210, 80, 52);
    g.fillStyle = '#eef0f6'; g.font = '500 54px ui-monospace, Consolas, monospace';
    g.fillText('•••• •••• •••• 4821', 80, 390);
    g.font = '500 30px system-ui, sans-serif'; g.fillText('VALID THRU 12/29', 80, 450);
  });
  const edge = std('#2a2f4a');
  const o = part(new THREE.BoxGeometry(8.56, 0.076, 5.398), [edge, edge, std('#fff', { map: top, roughness: 0.35 }), edge, edge, edge], 0, 0.038 + 0.004, 0);
  o.rotation.y = -0.25;
  return o;
}

function makeCan() {            // standard 330 ml can: Ø 6.6 cm, 11.5 cm tall
  const g = new THREE.Group();
  const label = canvasTex(1024, 512, (c, w, h) => {
    c.fillStyle = '#c62f2f'; c.fillRect(0, 0, w, h);
    c.fillStyle = '#f3efe6';
    c.beginPath(); c.moveTo(0, h * 0.62);
    for (let x = 0; x <= w; x += 8) c.lineTo(x, h * 0.62 + Math.sin(x / w * Math.PI * 4) * 30);
    c.lineTo(w, h * 0.72); for (let x = w; x >= 0; x -= 8) c.lineTo(x, h * 0.72 + Math.sin(x / w * Math.PI * 4) * 30);
    c.fill();
    c.font = '800 150px system-ui, sans-serif'; c.textAlign = 'center';
    c.fillText('FIZZ', w * 0.25, h * 0.45); c.fillText('FIZZ', w * 0.75, h * 0.45);
  });
  const alu = std('#c9ccd0', { metalness: 0.3, roughness: 0.35 });
  g.add(part(new THREE.CylinderGeometry(3.3, 3.3, 9.5, 48, 1, true), std('#fff', { map: label, roughness: 0.35 }), 0, 5.75, 0));
  g.add(part(new THREE.CylinderGeometry(3.3, 2.6, 1, 48), alu, 0, 0.5, 0));
  g.add(part(new THREE.CylinderGeometry(2.7, 3.3, 1, 48), alu, 0, 11, 0));
  g.add(part(new THREE.CylinderGeometry(0.6, 0.6, 0.08, 16), alu, 0.8, 11.53, 0));   // tab
  return g;
}

function makeBall() {           // size 7 basketball: Ø ~24 cm
  const tex = canvasTex(1024, 512, (g, w, h) => {
    g.fillStyle = '#d4682a'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(90,30,0,${Math.random() * 0.25})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
    g.strokeStyle = '#1b1410'; g.lineWidth = 7;
    for (const x of [0, w / 4, w / 2, 3 * w / 4]) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
    g.beginPath(); g.moveTo(0, h / 2); g.lineTo(w, h / 2); g.stroke();
    for (const cx of [w / 8, 5 * w / 8]) { g.beginPath(); g.ellipse(cx, h / 2, w / 10, h * 0.42, 0, 0, Math.PI * 2); g.stroke(); }
  });
  const o = part(new THREE.SphereGeometry(12, 48, 32), std('#fff', { map: tex, roughness: 0.8 }), 0, 12, 0);
  o.rotation.set(0.4, 0.6, 0.2);
  return o;
}

function makeChair() {          // seat 45 cm high, back 90 cm
  const g = new THREE.Group();
  const wood = std('#9c6a3c', { roughness: 0.7 });
  for (const [x, z] of [[-19, -19], [19, -19], [-19, 19], [19, 19]]) g.add(part(new THREE.BoxGeometry(3.5, 43, 3.5), wood, x, 21.5, z));
  g.add(part(new THREE.BoxGeometry(44, 3, 44), wood, 0, 44.5, 0));
  for (const x of [-19, 19]) g.add(part(new THREE.BoxGeometry(3.5, 45, 3.5), wood, x, 67.5, -19));
  g.add(part(new THREE.BoxGeometry(41, 16, 2.5), wood, 0, 80, -19));
  g.add(part(new THREE.BoxGeometry(41, 4, 2.5), wood, 0, 60, -19));
  g.rotation.y = -0.5;
  return g;
}

function makePerson() {         // stylised mannequin, 1.75 m
  const g = new THREE.Group();
  const skin = std('#c7cbd1', { roughness: 0.55 });
  for (const s of [-1, 1]) {
    g.add(part(new THREE.CapsuleGeometry(7, 74, 8, 16), skin, s * 10, 44, 0));          // legs
    g.add(part(new THREE.BoxGeometry(10, 5, 24), skin, s * 10, 2.5, 5));               // feet
    const arm = part(new THREE.CapsuleGeometry(5, 58, 8, 16), skin, s * 21.5, 118, 0);  // arms
    arm.rotation.z = s * 0.08; g.add(arm);
  }
  const torso = part(new THREE.CapsuleGeometry(16, 40, 8, 24), skin, 0, 115, 0);
  torso.scale.z = 0.6; g.add(torso);
  g.add(part(new THREE.CylinderGeometry(5, 5.5, 10, 16), skin, 0, 151, 0));
  const head = part(new THREE.SphereGeometry(11, 32, 24), skin, 0, 163.5, 0);
  head.scale.set(0.9, 1.05, 1); g.add(head);
  return g;
}

function makeCar() {            // generic compact hatchback, 4.5 × 1.8 × 1.45 m
  const g = new THREE.Group();
  const paint = std('#2f6db5', { roughness: 0.3, metalness: 0.2 });
  const glass = std('#1e262e', { roughness: 0.1, metalness: 0.4 });
  const extrude = (pts, depth, mat, bevel) => {
    const geo = new THREE.ExtrudeGeometry(new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y))),
      { depth, bevelEnabled: bevel > 0, bevelSize: bevel, bevelThickness: bevel, bevelSegments: 3 });
    geo.translate(0, 0, -depth / 2);
    return new THREE.Mesh(geo, mat);
  };
  g.add(extrude([[-219, 28], [219, 28], [219, 70], [196, 86], [108, 93], [-196, 97], [-219, 88]], 168, paint, 6));
  g.add(extrude([[106, 95], [38, 136], [-150, 139], [-205, 99]], 152, glass, 0));
  g.add(part(new THREE.BoxGeometry(192, 4, 154), paint, -56, 139.5, 0));
  const tyre = std('#1a1a1a', { roughness: 0.9 }), hub = std('#b8bcc2', { metalness: 0.5, roughness: 0.3 });
  for (const x of [-140, 140]) for (const z of [-79, 79]) {
    const w = part(new THREE.CylinderGeometry(32, 32, 22, 32), tyre, x, 32, z); w.rotation.x = Math.PI / 2; g.add(w);
    const h = part(new THREE.CylinderGeometry(19, 19, 23, 24), hub, x, 32, z); h.rotation.x = Math.PI / 2; g.add(h);
  }
  for (const z of [-62, 62]) {
    g.add(part(new THREE.BoxGeometry(4, 9, 28), std('#fff6d8', { emissive: '#665c40' }), 225, 72, z));
    g.add(part(new THREE.BoxGeometry(4, 9, 26), std('#b3121b'), -225, 80, z));
  }
  return g;
}

const REFS = {
  card:   { label: 'credit card (85,6 mm)', size: 8.56, make: makeCard },
  can:    { label: 'soda can (11,5 cm)', size: 11.5, make: makeCan },
  ball:   { label: 'basketball (Ø 24 cm)', size: 24, make: makeBall },
  chair:  { label: 'chair (90 cm)', size: 90, make: makeChair },
  person: { label: 'person (1,75 m)', size: 175, make: makePerson },
  car:    { label: 'car (4,5 m)', size: 450, make: makeCar },
};

// Auto: the two objects closest in size to the money (log scale), preferring smaller ones.
function pickReferences(size) {
  const S = Math.max(size.x, size.y, size.z);
  return Object.keys(REFS)
    .map(k => { const r = Math.log(REFS[k].size / S); return [k, Math.abs(r) * (r > 0 ? 1.5 : 1)]; })
    .sort((a, b) => a[1] - b[1]).slice(0, 2).map(([k]) => k)
    .sort((a, b) => REFS[b].size - REFS[a].size);
}

function placeReferences(box, choice) {
  refGroup.clear();
  if (choice === 'none' || box.isEmpty()) return [];
  const size = box.getSize(new THREE.Vector3());
  const keys = choice === 'auto' ? pickReferences(size) : [choice];
  const gap = Math.max(4, Math.max(size.x, size.z) * 0.12);
  // Line objects up along the screen's horizontal axis (perpendicular to the camera's view),
  // so they never stand in front of or behind the money.
  const R = new THREE.Vector3(VIEW_DIR.z, 0, -VIEW_DIR.x).normalize();   // screen-right on the floor
  const theta = -Math.atan2(R.z, R.x);
  const Y = new THREE.Vector3(0, 1, 0);
  const center = box.getCenter(new THREE.Vector3()).setY(0);
  let along = size.x / 2 * Math.abs(R.x) + size.z / 2 * Math.abs(R.z) + gap;
  for (const k of keys) {
    if (!refCache[k]) {
      const o = REFS[k].make();
      o.traverse(m => { if (m.isMesh) m.castShadow = m.receiveShadow = true; });
      refCache[k] = new THREE.Group().add(o);
    }
    const o = refCache[k];
    o.position.set(0, 0, 0); o.rotation.set(0, 0, 0);
    const bb = new THREE.Box3().setFromObject(o);
    const half = (bb.max.x - bb.min.x) / 2;
    const localCenter = new THREE.Vector3((bb.min.x + bb.max.x) / 2, 0, (bb.min.z + bb.max.z) / 2).applyAxisAngle(Y, theta);
    o.rotation.y = theta;
    o.position.copy(center).addScaledVector(R, along + half).sub(localCenter);
    refGroup.add(o);
    box.expandByObject(o);
    along += 2 * half + gap;
  }
  return keys.map(k => REFS[k].label);
}

// Fit camera, shadows and ground to the content
function frame(box) {
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const radius = Math.max(size.length() / 2, 6);
  const fov = THREE.MathUtils.degToRad(camera.fov);
  const fit = Math.min(fov, 2 * Math.atan(Math.tan(fov / 2) * camera.aspect));
  const dist = radius / Math.sin(fit / 2) * 1.05;
  camera.position.copy(center).addScaledVector(VIEW_DIR, dist);
  camera.near = THREE.MathUtils.clamp(dist / 120, 0.1, 2);
  camera.far = dist * 20;
  camera.updateProjectionMatrix();
  controls.target.copy(center);
  controls.minDistance = Math.max(camera.near * 4, 4);
  controls.maxDistance = dist * 4;
  controls.update();

  ground.scale.set(radius * 40, radius * 40, 1);
  ground.position.set(center.x, 0, center.z);

  sun.position.copy(center).add(new THREE.Vector3(-0.6, 1.4, 0.8).multiplyScalar(radius * 2));
  sun.target.position.copy(center);
  const sc = sun.shadow.camera;
  sc.left = sc.bottom = -radius * 1.4;
  sc.right = sc.top = radius * 1.4;
  sc.near = 0.1; sc.far = radius * 6;
  sc.updateProjectionMatrix();
}

// ---------- UI ----------
const form = document.getElementById('form');
const input = document.getElementById('amount');
const denomSel = document.getElementById('denom');
const errEl = document.getElementById('error');
const listEl = document.getElementById('breakdown');
const statsEl = document.getElementById('stats');
const refSel = document.getElementById('ref');

function render() {
  const r = parseAmount(input.value);
  if (r.error) { errEl.textContent = r.error; input.setAttribute('aria-invalid', 'true'); return; }
  errEl.textContent = ''; input.removeAttribute('aria-invalid');
  history.replaceState(null, '', `?amount=${r.value}&notes=${denomSel.value}&ref=${refSel.value}`);
  const den = Number(denomSel.value);
  const amount = r.value;
  const { full, partial, loose, refs } = build(amount, den);

  const items = [];
  if (full) items.push([`${fmt(full)} × full wad (100 × ${den}€)`, full * den * PER_STRAP]);
  if (partial) items.push([`1 × wad of ${partial} × ${den}€`, partial * den]);
  const looseCount = {};
  loose.forEach(l => looseCount[l] = (looseCount[l] || 0) + 1);
  Object.keys(looseCount).sort((a, b) => b - a).forEach(l => items.push([`${looseCount[l]} × loose ${l}€ note`, looseCount[l] * l]));
  listEl.innerHTML = items.map(([k, v]) => `<li><span>${k}</span><b>${fmt(v)}€</b></li>`).join('')
    + `<li><span><b>Total</b></span><b>${fmt(amount)}€</b></li>`;

  const notes = full * PER_STRAP + partial + loose.length;
  const heightCm = notes * T;
  const h = heightCm >= 100 ? `${(heightCm / 100).toLocaleString('de-DE', { maximumFractionDigits: 2 })} m` : `${heightCm.toLocaleString('de-DE', { maximumFractionDigits: 1 })} cm`;
  statsEl.textContent = `${fmt(notes)} notes · ${h} tall if piled into one column · note size ${NOTE[den].w * 10} × ${NOTE[den].d * 10} mm`
    + (refs.length ? ` · next to a ${refs.join(' and a ')}` : '');
}

form.addEventListener('submit', e => { e.preventDefault(); render(); });
denomSel.addEventListener('change', render);
refSel.addEventListener('change', render);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
const qs = new URLSearchParams(location.search);
if (qs.get('amount')) input.value = qs.get('amount');
if (NOTE[qs.get('notes')]) denomSel.value = qs.get('notes');
if (REFS[qs.get('ref')] || ['auto', 'none'].includes(qs.get('ref'))) refSel.value = qs.get('ref');
render();

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
